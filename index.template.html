<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CELPD · Espace de vote des candidatures</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230f766e'/%3E%3Ctext x='50' y='68' font-family='Arial Black,sans-serif' font-weight='900' font-size='30' fill='white' text-anchor='middle'%3ECELPD%3C/text%3E%3C/svg%3E">
<style>
:root{
  --brand:#0f766e; --brand-d:#0b5a54; --brand-2:#14b8a6; --accent:#0369a1;
  --ink:#123b39; --paper:#eef6f4; --card:#fff; --line:#d7e6e2; --muted:#5d7b77;
  --green:#0f766e; --green-bg:#e2f2ee; --red:#c0392b; --red-bg:#fbeceb;
  --amber:#b5851a; --amber-bg:#fbf3df; --radius:14px;
  --shadow:0 1px 2px rgba(15,78,74,.06),0 10px 30px rgba(15,78,74,.09);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;color:var(--ink);
  background:var(--paper);line-height:1.5;font-size:15px}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.01em}
a{color:var(--brand-d)}
button{font-family:inherit;cursor:pointer}
.hidden{display:none!important}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}

/* gate */
#gate{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:20px;position:relative;overflow:hidden;
  background:linear-gradient(160deg,#0e4f4a,#0f766e 60%,#127c72)}
.gate-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
.gate-overlay{position:absolute;inset:0;z-index:1;background:linear-gradient(160deg,rgba(14,79,74,.86),rgba(15,118,110,.72))}
.gate-card{position:relative;z-index:2}
.gate-card{background:#fff;border-radius:18px;box-shadow:var(--shadow);width:min(400px,94vw);padding:28px 26px;text-align:center}
.gate-card .logo{width:150px;margin:0 auto 12px;display:block}
.gate-card h1{font-size:19px}.gate-card .sub{color:var(--muted);font-size:13px;margin:4px 0 20px}
.field{text-align:left;margin-bottom:14px}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font-size:16px;background:#fff;color:var(--ink)}
.field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(15,118,110,.14)}
.btn{display:inline-flex;align-items:center;gap:8px;justify-content:center;border:none;background:var(--brand);color:#fff;
  padding:12px 18px;border-radius:10px;font-weight:600;font-size:14px;transition:background .2s;min-height:44px}
.btn:hover{background:var(--brand-d)}
.btn.block{width:100%}
.btn.ghost{background:#fff;color:var(--brand-d);border:1px solid var(--line)}
.btn.ghost:hover{background:#eef6f4}
.btn.accent{background:var(--accent)}.btn.accent:hover{background:#02537f}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:9px;min-height:40px}
.btn.green{background:var(--green)}.btn.red{background:var(--red)}.btn.red:hover{background:#a03225}
.err{color:var(--red);font-size:13px;margin-top:8px;min-height:16px}
.hint{font-size:12px;color:var(--muted);margin-top:14px;border-top:1px dashed var(--line);padding-top:12px;text-align:left}
.hint code{background:#e6f0ed;padding:1px 6px;border-radius:5px}
.madeby{margin-top:14px;font-size:12px;color:var(--muted);display:flex;gap:5px;justify-content:center;align-items:center}
.madeby a{color:var(--brand-d);text-decoration:none}.madeby a:hover{text-decoration:underline}
.deadline{font-size:12px;font-weight:600;color:var(--amber);margin-top:8px}
.deadline.closed{color:var(--red)}

/* header */
header.top{background:var(--brand);color:#fff;position:sticky;top:0;z-index:20;box-shadow:0 2px 14px rgba(15,78,74,.18)}
.top .wrap{display:flex;align-items:center;gap:13px;height:64px}
.top .logo{width:44px;height:44px;border-radius:10px;background:#fff;padding:3px;flex:0 0 auto;display:flex;overflow:hidden}
.top .logo svg{width:100%;height:100%}
.top .brand{font-weight:800;font-size:16px;letter-spacing:.02em;line-height:1.05}
.top .brand small{display:block;font-weight:400;opacity:.75;font-size:10.5px;letter-spacing:.05em;margin-top:2px}
.top .right{margin-left:auto;display:flex;align-items:center;gap:10px}
.guest{display:flex;align-items:center;gap:8px;font-size:12.5px;color:#d6efe9;background:rgba(255,255,255,.12);padding:6px 11px;border-radius:20px}
.guest .dot{width:8px;height:8px;border-radius:50%;background:var(--brand-2)}
.top .right button{background:rgba(255,255,255,.14);border:none;color:#fff;font-size:12.5px;font-weight:600;padding:8px 12px;border-radius:9px}
.top .right button:hover{background:rgba(255,255,255,.24)}

main{padding:24px 0 60px}
.hero{position:relative;overflow:hidden;border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:22px;
  min-height:190px;display:flex;align-items:flex-end;background:var(--brand-d)}
.hero-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
.hero-overlay{position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(9,45,42,.25),rgba(9,45,42,.78))}
.hero-txt{position:relative;z-index:2;padding:20px 22px;color:#fff}
.hero-txt .co{font-size:12px;opacity:.85;letter-spacing:.02em}
.hero-txt h2{font-size:22px;margin-top:3px}
.hero-txt .base{font-size:13.5px;opacity:.9;font-style:italic;margin-top:4px;max-width:60ch}
@media(max-width:820px){.hero{min-height:160px}.hero-txt h2{font-size:19px}}

.sec-head{display:flex;align-items:center;gap:10px;margin:26px 0 12px}
.sec-head h3{font-size:17px}
.sec-head .count{font-size:12px;font-weight:700;color:var(--brand-d);background:#e2f2ee;padding:2px 9px;border-radius:20px}
.sec-head .sp{margin-left:auto}

.grid{display:grid;gap:16px}
.grid.k2{grid-template-columns:repeat(2,1fr)}
.grid.k4{grid-template-columns:repeat(4,1fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card.pad{padding:20px}
.stat{padding:16px 18px}
.stat .n{font-size:27px;font-weight:800;color:var(--brand-d)}
.stat .l{font-size:11.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}

.cand{overflow:hidden}
.cand .body{padding:18px 20px}
.cand .h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.cand .co{font-size:17px;font-weight:700}
.cand .sector{color:var(--muted);font-size:13px;margin-top:2px}
.cohead{display:flex;gap:11px;align-items:flex-start}
.clogo{width:44px;height:44px;border-radius:10px;object-fit:contain;background:#fff;border:1px solid var(--line);padding:4px;flex:0 0 auto}
.clogo.sm{width:36px;height:36px;border-radius:9px}
.fiche{font-size:13px;color:#39544f;margin:12px 0 0;background:#f2f8f6;border-left:3px solid var(--brand-2);padding:9px 12px;border-radius:8px}
.weblink{display:inline-flex;align-items:center;gap:5px;margin-top:10px;font-size:13px;font-weight:600;color:var(--accent);text-decoration:none}
.weblink:hover{text-decoration:underline}
.cand dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:12px 0 0;font-size:13px}
.cand dt{color:var(--muted);font-weight:600}.cand dd{margin:0}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.tag{background:#e4f0ed;color:var(--brand-d);font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:20px}
.badge{font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:20px;white-space:nowrap}
.badge.pending{background:var(--amber-bg);color:var(--amber)}
.badge.acc{background:var(--green-bg);color:var(--green)}
.badge.rej{background:var(--red-bg);color:var(--red)}
.badge.sondage{background:#e3eef5;color:var(--accent)}
.chip{display:inline-block;background:var(--accent);color:#fff;font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px}
.votebar{height:10px;border-radius:6px;background:#e5efec;overflow:hidden;display:flex;margin:14px 0 8px}
.votebar i{display:block;height:100%}
.votebar .for{background:var(--brand)}.votebar .against{background:var(--red)}.votebar .abst{background:#bcccc8}
.tally{display:flex;gap:16px;font-size:12.5px;color:var(--muted);font-weight:600}.tally b{color:var(--ink)}
.voters{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.voters .vlab{font-size:11.5px;color:var(--muted);font-weight:600;align-self:center;margin-right:2px}
.voter{font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:20px;display:inline-flex;align-items:center;gap:5px;border:1px solid transparent}
.voter.for{background:var(--green-bg);color:var(--green);border-color:#bfe3d5}
.voter.against{background:var(--red-bg);color:var(--red);border-color:#f2cfca}
.voter.abstain{background:#eef1f0;color:#5d7b77;border-color:#dbe3e1}
.foot{display:flex;gap:8px;align-items:center;padding:14px 20px;border-top:1px solid var(--line);background:#f7fbfa;flex-wrap:wrap}
.foot .btn.sm{flex:1 1 auto}
.myvote{font-size:12.5px;font-weight:600;padding:8px 11px;border-radius:8px;background:#e4f0ed;flex:1 1 100%}
.decided{font-size:12px;color:var(--muted);margin-left:auto}

/* charts */
.viz{padding:18px 20px}
.viz h4{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:0 0 14px}
.donut-wrap{display:flex;align-items:center;gap:18px}
.legend{font-size:13px;display:flex;flex-direction:column;gap:7px}
.legend span{display:flex;align-items:center;gap:8px}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
.legend b{margin-left:4px}
.hbars{display:flex;flex-direction:column;gap:11px}
.hbar{font-size:13px}
.hbar .lab{display:flex;justify-content:space-between;margin-bottom:4px}
.hbar .track{height:9px;background:#e5efec;border-radius:5px;overflow:hidden}
.hbar .fill{height:100%;border-radius:5px;background:var(--brand)}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(9,45,42,.55);display:flex;align-items:center;justify-content:center;z-index:40;padding:16px}
.modal{background:#fff;border-radius:16px;box-shadow:var(--shadow);width:min(560px,96vw);max-height:92vh;overflow:auto}
.modal .m-head{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.modal .m-body{padding:20px 22px}
.modal .m-foot{padding:16px 22px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.x{background:none;border:none;font-size:22px;color:var(--muted)}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.formgrid .full{grid-column:1/-1}
.chk{display:flex;flex-wrap:wrap;gap:8px}
.chk label{display:flex;align-items:center;gap:6px;font-size:13px;background:#fff;border:1px solid var(--line);padding:7px 11px;border-radius:9px;cursor:pointer}
.chk label:has(input:checked){border-color:var(--brand);background:#e4f0ed;font-weight:600}
.req{color:var(--red)}
.note{background:var(--amber-bg);border:1px solid #f0e0b8;border-radius:12px;padding:13px 15px;font-size:12.5px;color:#6b5410}
.note b{color:#4d3c09}
.empty{text-align:center;padding:36px 20px;color:var(--muted)}
footer.legal{border-top:1px solid var(--line);padding:24px 0;color:var(--muted);font-size:12px;background:#fff}
footer.legal b{color:var(--ink)}

@media(max-width:820px){
  .grid.k2,.grid.k4,.formgrid{grid-template-columns:1fr}
  .wrap{padding:0 15px}
  .top .brand small{display:none}
  .guest span{display:none}
  .intro{flex-direction:row}
  .intro h2{font-size:17px}
}
</style>
</head>
<body>

<!-- ====== GATE ====== -->
<div id="gate">
  <video class="gate-video" autoplay muted loop playsinline preload="auto" poster="assets/celpd-login-poster.jpg"
    onerror="this.style.display='none'"><source src="assets/celpd-login.mp4" type="video/mp4"></video>
  <div class="gate-overlay"></div>
  <div class="gate-card">
    <div class="logo" id="gate-logo"></div>
    <h1>Espace de vote des candidatures</h1>
    <div class="sub">Club des Entreprises Lyon Part‑Dieu</div>
    <div class="field"><label>Nom de votre entreprise</label>
      <input id="gt-company" type="text" placeholder="Ex. Covivio" autocomplete="organization"></div>
    <div class="field"><label>Code d'accès</label>
      <input id="gt-code" type="text" autocapitalize="characters" placeholder="CELPD••••" autocomplete="one-time-code"></div>
    <button class="btn block" onclick="enter()">Entrer</button>
    <div class="err" id="gt-err"></div>
    <div class="hint"><b>Compte invité</b> — accès par lien + code simple&nbsp;: <code>CELPD26#</code><br>
      <span style="opacity:.75">Une entreprise = un vote par candidature.</span></div>
    <div class="madeby"><span>Créé par</span>
      <a href="https://exoflow.fr" target="_blank" rel="noopener"><b>Exoflow</b></a>
      <span>· outils métiers IA</span></div>
  </div>
</div>

<!-- ====== APP (page unique) ====== -->
<div id="app" class="hidden">
  <header class="top"><div class="wrap">
    <div class="logo" id="top-logo"></div>
    <div class="brand">CELPD<small>ESPACE DE VOTE</small></div>
    <div class="right">
      <span class="guest"><span class="dot"></span><span>Compte invité</span></span>
      <button onclick="reminder()" title="Aide — comment voter">? Aide</button>
      <button onclick="openNew()">+ Candidature</button>
      <button onclick="exportCSV()">⇩ Export</button>
    </div>
  </div></header>
  <main><div class="wrap" id="view"></div></main>
  <footer class="legal"><div class="wrap" id="legal"></div></footer>
</div>

<div id="modal-root"></div>

<script>

const LOGO='<img src="assets/celpd-logo.png" alt="CELPD — Lyon Part-Dieu" style="width:100%;height:100%;object-fit:contain;display:block">';

const DOMAINS=["Culture & communication","Immobilier","Innovation / IA","Mobilité (PMIE)",
  "Ressources humaines","Développement durable / RSE","Numérique","Développement commercial"];
const TIERS=[{v:1600,label:"1 600 € — Grand compte"},{v:850,label:"850 € — Grande entreprise"},

  {v:180,label:"180 € — TPE / indépendant"},{v:0,label:"Partenaire (0 €)"}];
function tierShort(v){if(v==null||v<0)return'À confirmer';return v?v.toLocaleString('fr-FR')+' €':'Partenaire';}
/* Fiche + site web (fallback par nom d'entreprise, utile en mode partagé si le Sheet ne stocke pas ces champs) */
const INFO={
  "co:jca":{web:"https://www.jca-groupe.fr",logo:"assets/logo-jca.png",
    desc:"Jeunes Chercheurs Associés — 1ʳᵉ coopérative scientifique française (SCIC, SIREN 849 895 032). Conseil, expertise et R&D en sciences appliquées (santé & sciences du vivant, action publique & territoires, industrie & technologies), en valorisant les compétences de jeunes docteurs. Siège à Clermont‑Ferrand, présence en Auvergne‑Rhône‑Alpes."},
  "co:la famille finest lunch":{web:"https://www.lf.fr",logo:"assets/logo-lafamille.png",
    desc:"Restaurant & traiteur de déjeuner (restauration rapide, SIREN 929 047 512). Sandwichs préparés minute, bowls et salades — sur place, à emporter, click & collect ou livrés au bureau avant 12h30. Établissement Part‑Dieu : 101 bd Marius Vivier‑Merle, 69003 Lyon."},
  "co:accor":{web:"https://group.accor.com",logo:"assets/logo-accor.png",
    desc:"Accor SA (SIREN 602 036 444) — groupe mondial leader de l'hospitalité : ~45 marques hôtelières (ibis, Mercure, Novotel, Sofitel…), plus de 5 600 hôtels dans ~110 pays. Plusieurs établissements sur le secteur Lyon Part‑Dieu."},
  "co:buro club lyon part-dieu":{web:"https://www.buro.com/centre/lyon-part-dieu/",logo:"assets/logo-buroclub.png",
    desc:"BURO Club Lyon Part‑Dieu — centre d'affaires au 21e étage de la Tour Part‑Dieu (129 rue Servient) : bureaux privés, espaces de coworking, domiciliation d'entreprise, salles de réunion équipées et services aux entreprises."},
  "co:espaces part-dieu":{web:"https://espacespartdieu.com/",logo:"assets/logo-espaces.svg",
    desc:"Centre d'événements lyonnais (fondé 2011, rénové 2023) : location d'espaces pour réunions, comités de direction, formations, coaching et séminaires, avec restauration et support technique. 2 place de Francfort, 69003 Lyon — à deux pas de la gare Part‑Dieu."},
  "co:promeom":{web:"https://www.promeom.fr",logo:"assets/logo-promeom.png",
    desc:"Association MC2A — Promeom (service de prévention et santé au travail interentreprises, SPSTI). Issue de la fusion Agemetra / AST Grand Lyon (01/01/2025), 1ᵉʳ opérateur de santé au travail en Auvergne‑Rhône‑Alpes ; plusieurs centres dans le 3ᵉ arrondissement."},
  "co:les ateliers de l'audace":{web:"https://ateliersdelaudace.fr",logo:"assets/logo-ateliers.png",
    desc:"Chantier d'insertion — réparation et vente de vélos reconditionnés, ateliers de mobilité douce en entreprise. Objectif : identifier des employeurs pour des salariés en insertion et promouvoir le vélo auprès des entreprises."}
};
function candWeb(c){return c.website||(INFO[ckey(c.company)]||{}).web||"";}
function candDesc(c){return c.desc||(INFO[ckey(c.company)]||{}).desc||"";}
function candLogo(c){return c.logo||(INFO[ckey(c.company)]||{}).logo||"";}
/* Sondage = consultatif : par status "sondage" OU par nom (robuste même si le Sheet stocke "pending") */
const SONDAGE=new Set(["co:promeom","co:les ateliers de l'audace"]);
function isSondage(c){return c.status==="sondage"||SONDAGE.has(ckey(c.company));}
const CA_VOTERS=7, QUORUM=4;
const ACCESS_CODE="CELPD26#";
let SESSION=null;
const DB_KEY="celpd_vote_v4";
const VOTE_WEEKS_MAX=5;
function ckey(name){return "co:"+(name||"").trim().toLowerCase().replace(/\s+/g," ");}
function addWeeks(iso,w){const d=new Date(iso+"T00:00:00");d.setDate(d.getDate()+w*7);return d.toISOString().slice(0,10);}
function todayISO(){return new Date().toISOString().slice(0,10);}
function isClosed(c){return c.voteEnd && todayISO()>c.voteEnd;}

/* ===== données (réinitialisées à chaque connexion — démo, en mémoire) ===== */
function seed(){return{
  candidatures:[
    {id:1,status:"pending",created:"2026-07-20",voteEnd:"2026-08-24",company:"JCA",
      sector:"Coopérative scientifique — conseil & R&D (sciences appliquées)",size:"—",tier:-1,
      address:"Lyon — Auvergne-Rhône-Alpes (adresse lyonnaise à préciser)",

    {id:2,status:"pending",created:"2026-07-20",voteEnd:"2026-08-24",company:"La Famille Finest Lunch",

      referent:"À préciser",referentMail:"contact@clubpartdieu.fr",referentPhone:"—",sponsor:"",
      motivation:"Entreprise du quartier (Buro Club Lyon Part-Dieu) candidate à l'adhésion au CELPD.",
      domains:[],votes:[]},
    {id:3,status:"pending",created:"2026-07-20",voteEnd:"2026-08-24",company:"Accor",sector:"Hôtellerie / hospitalité",size:"—",tier:-1,address:"Buro Club Lyon Part-Dieu — 129 rue Servient, 69003 Lyon (Tour Part-Dieu, 21e étage)",
      referent:"À préciser",referentMail:"contact@clubpartdieu.fr",referentPhone:"—",sponsor:"",
      motivation:"Entreprise domiciliée au Buro Club Lyon Part-Dieu, candidate à l'adhésion au CELPD.",
      domains:[],votes:[]},
    {id:4,status:"pending",created:"2026-07-20",voteEnd:"2026-08-24",company:"Buro Club Lyon Part-Dieu",
      sector:"Centre d'affaires — bureaux, coworking, domiciliation",size:"—",tier:-1,
      address:"129 rue Servient, 69003 Lyon (Tour Part-Dieu, 21e étage)",
      referent:"À préciser",referentMail:"contact@clubpartdieu.fr",referentPhone:"—",sponsor:"",
      motivation:"Centre d'affaires du quartier, candidat à l'adhésion au CELPD.",
      domains:["Immobilier"],votes:[]},
    {id:5,status:"pending",created:"2026-07-20",voteEnd:"2026-08-24",company:"Espaces Part-Dieu",
      sector:"Centre d'événements — location de salles, séminaires, formations",size:"—",tier:-1,
      address:"2 place de Francfort, 69003 Lyon (proche gare Part-Dieu)",
      referent:"À préciser",referentMail:"contact@clubpartdieu.fr",referentPhone:"—",sponsor:"",
      motivation:"Centre d'événements du quartier, candidat à l'adhésion au CELPD.",

/* ============================================================
   SAUVEGARDE DES VOTES — deux modes automatiques :
   • API_URL vide  → mode LOCAL (localStorage de ce navigateur, votes non partagés).
   • API_URL rempli→ mode PARTAGÉ : lecture/écriture dans un Google Sheet via Apps Script
     (tous les membres votent sur la même base). Colle ici l'URL du déploiement Web App.
     Procédure : voir apps-script/Code.gs et le README (« Sauvegarde des votes »).
   ============================================================ */
const API_URL="https://script.google.com/macros/s/AKfycbzdI2QzXMlzstMM23vC3kLUXNY8rahXBZIwl0obHIj6agI43NWvjt1oLuOUX4YNMUrqyg/exec";

let DB={candidatures:[],seq:1};
function loadLocal(){try{const r=localStorage.getItem(DB_KEY);if(r)return JSON.parse(r);}catch(e){}return seed();}
function saveLocal(){try{localStorage.setItem(DB_KEY,JSON.stringify(DB));}catch(e){}}
function toISO(v){if(!v)return"";var s=String(v);
  var m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return m[1]+"-"+m[2]+"-"+m[3];
  // Sheets renvoie une date longue "Wed Jul 15 2026 ..." → extraire sans passer par UTC (évite le -1 jour)
  var MM={Jan:"01",Feb:"02",Mar:"03",Apr:"04",May:"05",Jun:"06",Jul:"07",Aug:"08",Sep:"09",Oct:"10",Nov:"11",Dec:"12"};
  var d2=s.match(/\b([A-Z][a-z]{2}) (\d{1,2}) (\d{4})\b/);
  if(d2&&MM[d2[1]])return d2[3]+"-"+MM[d2[1]]+"-"+("0"+d2[2]).slice(-2);
  var d=new Date(s);return isNaN(d)?s:d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2);}
function normalize(st){st=st||{};const cs=(st.candidatures||[]).map(c=>Object.assign({votes:[]},c,
  {created:toISO(c.created),voteEnd:toISO(c.voteEnd),decided:toISO(c.decided)}));
  return {candidatures:cs,seq:st.seq||(cs.reduce((m,c)=>Math.max(m,c.id),0)+1)};}
async function apiGet(){const r=await fetch(API_URL,{method:"GET"});return normalize(await r.json());}
async function apiPost(payload){const r=await fetch(API_URL,{method:"POST",body:JSON.stringify(payload)});return normalize(await r.json());}
async function pull(){DB=API_URL?await apiGet():normalize(loadLocal());}

function histCard(c){
  const t=tally(c),total=t.for+t.against+t.abstain||1;
  const badge=c.status==="accepted"?`<span class="badge acc">✓ Acceptée</span>`:`<span class="badge rej">✕ Refusée</span>`;
  return `<div class="card cand"><div class="body">

function voteBar(t,total){return`<div class="votebar"><i class="for" style="width:${t.for/total*100}%"></i>
  <i class="against" style="width:${t.against/total*100}%"></i><i class="abst" style="width:${t.abstain/total*100}%"></i></div>`;}
function voteLabel(v){return{for:"✅ Pour",against:"❌ Contre",abstain:"⚪ Abstention"}[v];}
function voteShort(v){return{for:"Pour",against:"Contre",abstain:"Abst."}[v];}
function votersList(c){
  if(!c.votes.length)return`<div class="voters"><span class="vlab">Aucun vote pour l'instant.</span></div>`;
  const order={for:0,against:1,abstain:2};
  const items=c.votes.slice().sort((a,b)=>order[a.v]-order[b.v]).map(v=>
    `<span class="voter ${v.v}">${esc(v.company||v.by)} · ${voteShort(v.v)}</span>`).join("");
  return`<div class="voters"><span class="vlab">Qui a voté :</span>${items}</div>`;
}

/* un seul vote par candidature (invité) */
async function vote(id,v){
  const c=DB.candidatures.find(x=>x.id===id);
  if(!c||isClosed(c)||myVote(c))return;
  c.votes.push({by:SESSION.id,company:SESSION.name,v,c:""});render(); // optimiste
  if(API_URL){try{DB=await apiPost({action:"vote",candidatureId:id,companyKey:SESSION.id,company:SESSION.name,vote:v});}catch(e){}render();}
  else saveLocal();
}

/* ===== data-viz (SVG/CSS, sans dépendance) ===== */
function dataviz(){
  const cs=DB.candidatures;
  const status={"En attente":cs.filter(c=>c.status==="pending").length,
    "Acceptées":cs.filter(c=>c.status==="accepted").length,
    "Refusées":cs.filter(c=>c.status==="rejected").length};
  const vTot={Pour:0,Contre:0,Abstention:0};
  cs.forEach(c=>{const t=tally(c);vTot.Pour+=t.for;vTot.Contre+=t.against;vTot.Abstention+=t.abstain;});
  const tiers={};cs.forEach(c=>{const k=tierShort(c.tier);tiers[k]=(tiers[k]||0)+1;});
  const doms={};cs.forEach(c=>c.domains.forEach(d=>doms[d]=(doms[d]||0)+1));
  const topDoms=Object.entries(doms).sort((a,b)=>b[1]-a[1]).slice(0,6);
  return `<div class="grid k2">
    <div class="card viz"><h4>Décisions</h4>
      ${donut([["Acceptées",status["Acceptées"],"#0f766e"],["Refusées",status["Refusées"],"#c0392b"],["En attente",status["En attente"],"#b5851a"]])}</div>
    <div class="card viz"><h4>Votes cumulés</h4>
      ${hbars([["Pour",vTot.Pour,"#0f766e"],["Contre",vTot.Contre,"#c0392b"],["Abstention",vTot.Abstention,"#bcccc8"]])}</div>
    <div class="card viz"><h4>Candidatures par palier de cotisation</h4>
      ${hbars(Object.entries(tiers).sort((a,b)=>b[1]-a[1]).map(([k,v])=>[k,v,"#0369a1"]))}</div>
    <div class="card viz"><h4>Thématiques les plus demandées</h4>
      ${hbars(topDoms.map(([k,v])=>[k,v,"#14b8a6"]))}</div>
  </div>`;
}
function donut(data){
  const tot=data.reduce((s,d)=>s+d[1],0)||1;let a=-90;const R=54,C=2*Math.PI*R;
  const segs=data.map(([l,v,col])=>{const frac=v/tot,len=frac*C;
    const el=`<circle r="${R}" cx="70" cy="70" fill="none" stroke="${col}" stroke-width="22"
      stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-((a+90)/360)*C}" transform="rotate(-90 70 70)"/>`;
    a+=frac*360;return el;}).join("");
  const legend=data.map(([l,v,col])=>`<span><i style="background:${col}"></i>${l}<b>${v}</b></span>`).join("");
  return `<div class="donut-wrap"><svg width="140" height="140" viewBox="0 0 140 140">${segs}
    <text x="70" y="66" text-anchor="middle" font-size="24" font-weight="800" fill="#0b5a54">${tot}</text>
    <text x="70" y="86" text-anchor="middle" font-size="10" fill="#5d7b77">CANDID.</text></svg>
    <div class="legend">${legend}</div></div>`;
}
function hbars(data){
  const max=Math.max(1,...data.map(d=>d[1]));
  return `<div class="hbars">${data.map(([l,v,col])=>
    `<div class="hbar"><div class="lab"><span>${esc(l)}</span><b>${v}</b></div>
     <div class="track"><div class="fill" style="width:${v/max*100}%;background:${col}"></div></div></div>`).join("")}</div>`;
}

function submitCand(e){
  e.preventDefault();const f=e.target,g=n=>f.elements[n].value.trim();
  const doms=[...f.querySelectorAll('input[name=dom]:checked')].map(x=>x.value);
  const created=todayISO();const maxEnd=addWeeks(created,VOTE_WEEKS_MAX);
  let voteEnd=f.elements.voteEnd.value||maxEnd;
  if(voteEnd>maxEnd)voteEnd=maxEnd; if(voteEnd<created)voteEnd=created;   // borne : ≤ 5 semaines
  const cand={id:DB.seq++,status:"pending",created,voteEnd,
    company:g("company"),sector:g("sector"),size:g("size")||"—",tier:parseInt(f.elements.tier.value,10),
    address:g("address"),referent:g("referent"),referentMail:g("referentMail"),referentPhone:"—",
    sponsor:g("sponsor"),motivation:g("motivation"),website:g("website"),desc:g("desc"),domains:doms,votes:[]};
  DB.candidatures.unshift(cand);closeModal();render(); // optimiste
  if(API_URL){apiPost({action:"candidature",candidature:cand}).then(st=>{DB=st;render();}).catch(()=>{});}
  else saveLocal();
}

/* ===== export (garder l'historique) ===== */
function exportCSV(){
  // neutralise l'injection de formule CSV (champs commençant par = + - @) puis échappe
  const cell=x=>{let s=String(x);if(/^[=+\-@\t\r]/.test(s))s="'"+s;return`"${s.replace(/"/g,'""')}"`;};
  const h=["id","statut","entreprise","secteur","palier","referent","pour","contre","abstention","cree","decide"];
  const rows=DB.candidatures.map(c=>{const t=tally(c);
    return[c.id,c.status,c.company,c.sector,c.tier,c.referent,t.for,t.against,t.abstain,c.created,c.decided||""]
      .map(cell).join(",");});
  const b=new Blob(["﻿"+h.join(",")+"\n"+rows.join("\n")],{type:"text/csv"});
  const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="celpd-historique-votes.csv";a.click();
}
